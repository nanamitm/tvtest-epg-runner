# TVTest EPG Runner の設定
# %APPDATA%\TVTestEpgRunner\config.toml にコピーして書き換えてください。
# トレイの「設定…」から編集した場合も、この形式で書き戻されます。

[tvtest]
# 番組表取得専用の TVTest。視聴用とは別のフォルダを使ってください。
exe = 'C:\Free Soft Ware\TVTest64bit EPG\TVTest.exe'
# /epgcaptureexit と /epgcapturetimeout はランナーが付けるので不要です。
extra_args = ["/log"]

# 巡回するチューナーを順番に並べます。上から順に実行します。
[[driver]]
name = "BonDriver_dantto4k.dll"
timeout = "40m"      # 1本あたりの取得の制限時間
min_window = "15m"   # EDCB の予約までこれ未満しか空きがなければスキップ
instances = 1        # 同時に走らせる本数 (空きチューナー数まで自動で下がる)
channels = ""        # 対象にするチャンネル (/epgcapturech と同じ書式、空で全部)

[[driver]]
name = "BonDriver_PX-MLT.dll"
timeout = "30m"
min_window = "10m"
instances = 3
channels = ""

[priority]
# 最終取得が古いチャンネルから順に取得します。1回の取得で回りきれない場合も、
# 次の実行で続きから回るので、少しずつ全チャンネルが更新されます。
enabled = true
# 他の TVTest が更新した分を取り直さないよう、アドオンの最終更新時刻も見ます。
use_addon = true
# 1回に詰め込みすぎないよう、制限時間から差し引く余裕。
reserve = "2m"

[schedule]
# 毎日この時刻に実行します。every = "6h" のように間隔指定もできます
# (times と every はどちらか一方)。
times = ["04:30", "16:30"]
# 起動直後にも1回実行する場合は true。
run_at_start = false

[edcb]
# EpgTimerSrv の HTTP サーバ (EnableHttpSrv=1 / HttpPort)。
url = "http://127.0.0.1:5510"
# 予約のこれだけ手前で取得をやめます。EDCB の NGEpgCapTime と同じ考え方です。
guard = "10m"
# 実行中に予約を確認する間隔。
poll = "30s"
# 予約に個別マージンがないときに使う既定値 (EpgTimerSrv.ini の StartMargin/EndMargin)。
default_start_margin = "30s"
default_end_margin = "30s"
# true にすると、EDCB に問い合わせできないときは取得しません。
required = true

[server]
# Home Assistant が無い環境向けに、EPG 共有サーバをこのアプリの中で動かします。
# LAN の TVTest からは http://<このPC>:8077 を指定します。
enabled = false
api_port = 8077     # TVTest が接続するポート
ui_port = 8099      # ブラウザで番組表を見るポート (0 で無効)
token = ""          # 空にすると誰でも読み書きできます
data_dir = ""       # EPG の保管先 (空ならログと同じ場所の epg)
retention_days = 14

[addon]
# 実行結果の送信先。内蔵サーバを使う場合は http://127.0.0.1:8077 を指定します。
# Home Assistant の TVTest EPG Sync アドオン。空にすると通知しません。
url = "http://192.168.10.66:8077"
token = ""
name = "epg-runner"

[log]
# 省略すると設定ファイルと同じフォルダの runner.log になります。
#file = 'C:\Free Soft Ware\TVTest64bit EPG\runner.log'
level = "INFO"
